[project]
name = "data-lab"
version = "0.1.0"
description = "Testbeds and checks for the book What the Model Sees: Training Data from First Principles. Local only; never published."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Ioannis Antoniadis" }]
classifiers = ["Private :: Do Not Upload"]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-timeout>=2.3",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_lab"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4"]

[tool.ruff.lint.per-file-ignores]
# One record per technique, written as dict(...) calls so each reads like a data card.
"scripts/technique_data.py" = ["C408", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
addopts = "-ra"
