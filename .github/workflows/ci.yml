name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Python dependencies (locked)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Test (with per-test timeout from pyproject.toml)
        run: uv run pytest

      - name: Word count (fails above the 35,000-word cap)
        run: uv run python scripts/word_count.py

      - name: Portability rules (objectives-book SPEC §21.1)
        run: uv run python scripts/check_portability.py

      - name: Generated includes are current
        run: |
          uv run python scripts/technique_data.py
          git diff --exit-code docs/includes
