name: Build and deploy docs

# Renders the book on every push and pull request (any Quarto warning fails the build) and
# deploys it to GitHub Pages from main (DECISIONS D5, closed 2026-10-05: public).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render (any warning fails the build)
        shell: bash  # explicit shell turns on pipefail, so a failed render is not masked by tee
        run: |
          quarto render docs 2>&1 | tee render.log
          if grep -q "WARN" render.log; then
            echo "Quarto emitted warnings (unresolved cross-references or citations?)"
            exit 1
          fi

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
